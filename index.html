
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine - 동물상 테스트</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 40px;
        }

        h2 {
            color: #333;
        }

        #preview {
            margin: 20px;
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
        }

        #result {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #3366cc;
        }

        #label-container {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.8;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<center>

    <h2>🐶 동물상 테스트 🦊</h2>

    <p>이미지를 업로드하면 어떤 동물상인지 알려드립니다.</p>

    <!-- 이미지 업로드 -->
    <input type="file" id="image-upload" accept="image/*">

    <br>

    <!-- 업로드 이미지 미리보기 -->
    <img id="preview" style="display:none;">

    <br>

    <!-- 분석 버튼 -->
    <button type="button" onclick="predictImage()">
        동물상 분석하기
    </button>

    <!-- 최종 판별 결과 -->
    <div id="result"></div>

    <!-- 클래스별 예측 확률 -->
    <div id="label-container"></div>


    <script>

        // Teachable Machine 모델 경로
        const MODEL_URL = "./my_model/";

        let model;

        // 모델 불러오기
        async function init() {

            try {
                const modelURL = MODEL_URL + "model.json";
                const metadataURL = MODEL_URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);

                console.log("모델 로딩 완료");

            } catch (error) {
                console.error("모델 로딩 실패:", error);
                alert("모델을 불러오지 못했습니다. my_model 폴더를 확인하세요.");
            }
        }


        // 이미지 업로드 및 미리보기
        document.getElementById("image-upload")
            .addEventListener("change", function(event) {

                const file = event.target.files[0];

                if (!file) return;

                const image = document.getElementById("preview");

                // 이미지 임시 주소 생성
                image.src = window.URL.createObjectURL(file);

                image.style.display = "block";

                document.getElementById("result").innerHTML = "";
                document.getElementById("label-container").innerHTML = "";

            });


        // 이미지 분석
        async function predictImage() {

            if (!model) {
                alert("모델을 불러오는 중입니다. 잠시 후 다시 시도하세요.");
                return;
            }

            const image = document.getElementById("preview");

            if (!image.src || !image.complete || image.naturalWidth === 0) {
                alert("먼저 이미지를 업로드하세요.");
                return;
            }

            try {

                // 이미지 분류 실행
                const prediction = await model.predict(image);

                // 가장 높은 확률의 클래스 찾기
                let bestPrediction = prediction[0];

                for (let i = 1; i < prediction.length; i++) {

                    if (prediction[i].probability >
                        bestPrediction.probability) {

                        bestPrediction = prediction[i];
                    }
                }

                // 클래스 이름과 확률
                const animal = bestPrediction.className;
                const probability = bestPrediction.probability;

                // 최종 결과 출력
                document.getElementById("result").innerHTML =
                    `당신은 "${animal}"상입니다!<br>
                     (${(probability * 100).toFixed(1)}% 확률)`;

                // 클래스별 예측 결과 출력
                const labelContainer =
                    document.getElementById("label-container");

                labelContainer.innerHTML = "<h3>분류별 인식 결과</h3>";

                for (let i = 0; i < prediction.length; i++) {

                    const className = prediction[i].className;
                    const score = prediction[i].probability;

                    const div = document.createElement("div");

                    div.innerHTML =
                        `${className} : ${(score * 100).toFixed(1)}%`;

                    labelContainer.appendChild(div);
                }

            } catch (error) {
                console.error("이미지 분석 실패:", error);
                alert("이미지 분석 중 오류가 발생했습니다.");
            }
        }


        // 페이지가 열리면 모델 불러오기
        init();

    </script>
</center>
</body>
</html>
