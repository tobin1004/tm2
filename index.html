<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>인물별 동물상 테스트</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- TensorFlow.js (버전 고정: PC/모바일 동일 버전 보장) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>

    <!-- Teachable Machine (버전 고정) -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

    <style>
        /* 색상, 둥근 정도 등 공통 값 (여기서 한 번에 바꿀 수 있음) */
        :root {
            --bg: #e6f4f0;
            --panel: #ffffff;
            --ink: #16312c;
            --muted: #5f7d76;
            --line: #cfe6df;
            --brand: #0f9d8a;
            --brand-dark: #0a7667;
            --sun: #ffc83d;
            --err: #c0304f;
            --radius: 24px;
        }

        /* 패딩이 있어도 너비가 넘치지 않게 계산 방식 통일 */
        * { box-sizing: border-box; }

        /* 페이지 전체 배경, 글꼴 */
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--ink);
            font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            line-height: 1.55;
        }

        /* 전체 내용을 가운데 정렬하는 컨테이너 */
        .app {
            max-width: 560px;
            margin: 0 auto;
            padding: 32px 18px 48px;
        }

        /* 제목 영역 */
        header { text-align: center; margin-bottom: 22px; }

        h1 {
            margin: 0 0 6px;
            font-family: "Jua", "Noto Sans KR", sans-serif;
            font-weight: 400;
            font-size: clamp(32px, 8vw, 44px);
        }

        .lead {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
        }

        /* 흰색 카드 (업로드 카드, 결과 카드 공통) */
        .panel {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 6px 0 var(--line);
            margin-bottom: 20px;
        }

        /* ---------- 업로드 ---------- */

        /* 실제 파일 입력창은 숨기고, 아래 dropzone(label)을 대신 보여줌 */
        #image-upload {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        /* 점선 업로드 박스: 클릭 또는 드래그 앤 드롭으로 사진 선택 */
        .dropzone {
            display: block;
            border: 3px dashed var(--line);
            border-radius: 18px;
            padding: 22px 16px;
            text-align: center;
            cursor: pointer;
            background: #f5fbf9;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        /* 마우스를 올리거나 파일을 끌어왔을 때 강조 */
        .dropzone:hover,
        .dropzone.drag { border-color: var(--brand); background: #eaf8f4; }

        #image-upload:focus-visible + .dropzone {
            outline: 3px solid var(--sun);
            outline-offset: 3px;
        }

        .dropzone .icon { font-size: 40px; line-height: 1.2; }

        .dropzone .main { font-weight: 700; font-size: 17px; }

        .dropzone .sub { color: var(--muted); font-size: 14px; }

        /* 업로드한 사진 미리보기 영역 (사진을 올리면 .show가 붙어 나타남) */
        .preview-wrap {
            display: none;
            margin-top: 16px;
            text-align: center;
        }

        .preview-wrap.show { display: block; }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 320px;
            width: auto;
            height: auto;
            margin: 0 auto;
            border-radius: 18px;
            object-fit: contain;
            border: 4px solid var(--line);
            background: #f5fbf9;
        }

        #image-info {
            margin-top: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        /* ---------- 버튼 / 상태 ---------- */

        /* 분석하기 버튼 */
        button {
            width: 100%;
            margin-top: 16px;
            padding: 15px 20px;
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            background: var(--brand);
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 0 var(--brand-dark);
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        button:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 1px 0 var(--brand-dark);
        }

        button:disabled {
            background: #a9c4be;
            box-shadow: 0 5px 0 #8eaca5;
            cursor: not-allowed;
        }

        button:focus-visible {
            outline: 3px solid var(--sun);
            outline-offset: 3px;
        }

        /* 상태 메시지 (오류는 .error, 진행 중은 .busy로 표시) */
        #status {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 12px;
            background: #eef7f4;
            color: var(--ink);
            font-size: 14px;
            text-align: center;
        }

        #status.error { background: #ffe3e8; color: var(--err); }

        #status.busy::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 8px;
            border: 3px solid var(--line);
            border-top-color: var(--brand);
            border-radius: 50%;
            vertical-align: -1px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- 결과 ---------- */

        /* 결과 카드: 분석이 끝나면 .show가 붙어 나타남 */
        #result-panel { display: none; }
        #result-panel.show { display: block; }

        /* 최종 결과 박스 ("OO상입니다!") */
        #result {
            text-align: center;
            padding: 14px 12px;
            border-radius: 18px;
            background: #fff4d1;
        }

        #result .emoji {
            font-size: 48px;
            line-height: 1.1;
            animation: pop 0.5s ease-out;
        }

        #result .headline {
            margin-top: 4px;
            font-family: "Jua", sans-serif;
            font-size: clamp(20px, 5vw, 24px);
        }

        #result .percent {
            margin-top: 2px;
            color: #7a5b00;
            font-size: 14px;
            font-weight: 700;
        }

        @keyframes pop {
            from { transform: scale(0.4); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        /* 동물상별 확률 막대 그래프 영역 */
        #label-container { margin-top: 20px; }

        #label-container h3 {
            margin: 0 0 12px;
            font-size: 15px;
            color: var(--muted);
        }

        .result-item { margin: 14px 0; }

        .result-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 15px;
        }

        .progress {
            width: 100%;
            height: 14px;
            background: #e9f2ef;
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #9bc7bd;
            border-radius: 99px;
            transition: width 0.6s ease;
        }

        .result-item.top .progress-bar { background: var(--brand); }
        .result-item.top .result-title { font-weight: 700; }

        /* 디버그용 영역 (DEBUG_PREPROCESS = true일 때만 내용이 생김) */
        #debug-container {
            margin-top: 14px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }

        #debug-container canvas {
            display: block;
            margin: 8px auto;
            border: 1px solid var(--line);
        }

        /* 움직임 줄이기 설정을 켠 사용자는 애니메이션 끔 */
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>

<body>
<div class="app">

    <!-- 제목과 안내 문구 -->
    <header>
        <h1>🐶 동물상 테스트 🦊</h1>
        <p class="lead">내 사진이나 닮은 연예인 사진을 올리면<br>AI가 어떤 동물상인지 알려드려요.</p>
    </header>

    <!-- 업로드 카드: 사진 선택, 미리보기, 분석 버튼, 상태 메시지 -->
    <section class="panel" aria-label="이미지 업로드">

        <!-- 이미지 업로드 -->
        <input type="file" id="image-upload" accept="image/*">
        <label class="dropzone" id="dropzone" for="image-upload">
            <div class="icon">📷</div>
            <div class="main">사진 선택하기</div>
            <div class="sub">클릭하거나 사진을 끌어다 놓으세요 (JPG, PNG)</div>
        </label>

        <!-- 이미지 미리보기 -->
        <div class="preview-wrap" id="preview-wrap">
            <img id="preview" alt="업로드 이미지 미리보기">
            <div id="image-info"></div>
        </div>

        <!-- 분석 버튼 -->
        <button type="button" id="analyze-button" disabled>
            동물상 분석하기
        </button>

        <!-- 모델 상태 -->
        <div id="status" role="status" aria-live="polite">
            AI 모델을 불러오는 중입니다...
        </div>

    </section>

    <!-- 결과 카드: 분석이 끝난 뒤에만 표시 -->
    <section class="panel" id="result-panel" aria-label="분석 결과" aria-live="polite">

        <!-- 최종 결과 -->
        <div id="result"></div>

        <!-- 클래스별 확률 -->
        <div id="label-container"></div>

        <!-- 디버그: 모델에 실제로 들어간 224x224 이미지 (DEBUG_PREPROCESS = true 일 때만 표시) -->
        <div id="debug-container"></div>

    </section>

</div>


<script>

    // =====================================
    // 1. 모델 설정
    // =====================================

    const MODEL_URL = "./my_model/";

    // Teachable Machine 기본 이미지 입력 크기
    const IMAGE_SIZE = 224;

    // 전처리 중간 단계 해상도 (기기와 상관없이 고정)
    const MID_SIZE = 512;

    // true로 바꾸면 모델에 들어간 224x224 이미지와 백엔드 정보를 화면에 표시
    const DEBUG_PREPROCESS = false;

    let model = null;

    let modelReady = false;
    let imageReady = false;
    let isAnalyzing = false;

    let currentObjectURL = null;

    // EXIF 회전이 적용된 이미지 비트맵 (분석에 사용)
    let currentBitmap = null;

    // 클래스 이름에 포함된 단어로 이모지를 고름 (없으면 🐾)
    const animalEmoji = [
        ["강아지", "🐶"], ["개", "🐶"], ["dog", "🐶"],
        ["고양이", "🐱"], ["cat", "🐱"],
        ["여우", "🦊"], ["fox", "🦊"],
        ["토끼", "🐰"], ["rabbit", "🐰"],
        ["곰", "🐻"], ["bear", "🐻"],
        ["사슴", "🦌"], ["deer", "🦌"],
        ["공룡", "🦖"], ["dinosaur", "🦖"],
        ["늑대", "🐺"], ["wolf", "🐺"],
        ["햄스터", "🐹"], ["hamster", "🐹"],
        ["펭귄", "🐧"], ["penguin", "🐧"],
        ["오리", "🦆"], ["duck", "🦆"],
        ["말", "🐴"], ["horse", "🐴"],
        ["호랑이", "🐯"], ["tiger", "🐯"],
        ["원숭이", "🐵"], ["monkey", "🐵"]
    ];

    // 클래스 이름 -> 이모지 변환 함수
    function emojiFor(className) {

        const n = className.toLowerCase();

        for (const pair of animalEmoji) {
            if (n.includes(pair[0])) return pair[1];
        }

        return "🐾";

    }


    // =====================================
    // 2. HTML 요소 가져오기
    // =====================================

    const uploadInput = document.getElementById("image-upload");
    const dropzone = document.getElementById("dropzone");
    const preview = document.getElementById("preview");
    const previewWrap = document.getElementById("preview-wrap");
    const analyzeButton = document.getElementById("analyze-button");
    const statusEl = document.getElementById("status");
    const resultPanel = document.getElementById("result-panel");
    const resultEl = document.getElementById("result");
    const labelContainer = document.getElementById("label-container");
    const imageInfo = document.getElementById("image-info");
    const debugContainer = document.getElementById("debug-container");

    // 상태 메시지 표시 (mode: "busy" = 진행 중, "error" = 오류, 없으면 일반)
    function setStatus(text, mode) {
        statusEl.textContent = text;
        statusEl.className = mode || "";
    }


    // =====================================
    // 3. 분석 버튼 상태 관리
    // =====================================

    function updateButton() {

        analyzeButton.disabled =
            !modelReady ||
            !imageReady ||
            isAnalyzing;

    }


    // =====================================
    // 4. AI 모델 로딩
    // =====================================

    async function init() {

        try {

            setStatus("TensorFlow.js 초기화 중...", "busy");

            // PC와 모바일의 연산 백엔드 통일
            await tf.setBackend("cpu");

            // TensorFlow 초기화 완료 대기
            await tf.ready();

            console.log("TensorFlow Backend:", tf.getBackend());
            console.log("TensorFlow Version:", tf.version.tfjs);

            setStatus("AI 모델을 불러오는 중입니다...", "busy");

            const modelURL = MODEL_URL + "model.json";
            const metadataURL = MODEL_URL + "metadata.json";

            // Teachable Machine 모델 로딩
            model = await tmImage.load(modelURL, metadataURL);

            modelReady = true;

            console.log("모델 로딩 완료");
            console.log("클래스 목록:", model.getClassLabels());

            let message = "모델 로딩 완료! 사진을 올려주세요.";

            if (DEBUG_PREPROCESS) {
                message += ` (backend: ${tf.getBackend()}, tfjs: ${tf.version.tfjs})`;
            }

            setStatus(message);

            updateButton();

        } catch (error) {

            console.error("모델 로딩 오류:", error);

            setStatus("모델 로딩에 실패했습니다. my_model 폴더를 확인하세요.", "error");

            alert("AI 모델을 불러오지 못했습니다. 모델 폴더를 확인하세요.");

        }

    }


    // =====================================
    // 5. 이미지 업로드
    // =====================================

    // 선택하거나 끌어다 놓은 파일을 검사하고 미리보기를 만드는 함수
    async function handleFile(file) {

        if (!file) return;

        // 이미지 파일 확인
        if (!file.type.startsWith("image/")) {

            alert("이미지 파일만 업로드할 수 있습니다.");

            uploadInput.value = "";

            return;

        }

        // 이전 결과 초기화
        resultEl.innerHTML = "";
        labelContainer.innerHTML = "";
        debugContainer.innerHTML = "";
        imageInfo.textContent = "";
        resultPanel.classList.remove("show");

        imageReady = false;

        updateButton();

        try {

            // 이전 임시 URL / 비트맵 해제
            if (currentObjectURL) {
                URL.revokeObjectURL(currentObjectURL);
            }

            if (currentBitmap && currentBitmap.close) {
                currentBitmap.close();
            }

            currentBitmap = null;

            // 새로운 이미지 URL 생성 (미리보기용)
            currentObjectURL = URL.createObjectURL(file);

            preview.src = currentObjectURL;
            preview.style.display = "block";
            previewWrap.classList.add("show");

            // 이미지 디코딩 완료 대기
            await preview.decode();

            // EXIF 회전을 일관되게 적용한 비트맵 생성
            let width = preview.naturalWidth;
            let height = preview.naturalHeight;

            if (window.createImageBitmap) {

                try {

                    currentBitmap = await createImageBitmap(file, {
                        imageOrientation: "from-image"
                    });

                    width = currentBitmap.width;
                    height = currentBitmap.height;

                } catch (bitmapError) {

                    console.warn(
                        "createImageBitmap 실패, <img>로 대체:",
                        bitmapError
                    );

                    currentBitmap = null;

                }

            }

            if (width === 0 || height === 0) {

                throw new Error("이미지 크기를 확인할 수 없습니다.");

            }

            imageReady = true;

            imageInfo.textContent = `${file.name} · ${width} × ${height}`;

            setStatus("사진을 불러왔어요! 분석할 수 있습니다.");

            console.log("업로드 파일:", file.name);
            console.log("파일 크기:", file.size, "bytes");
            console.log("이미지 실제 크기:", width, height);

            updateButton();

        } catch (error) {

            console.error("이미지 업로드 오류:", error);

            setStatus("이미지를 불러오지 못했습니다. JPG 또는 PNG 파일을 사용해 주세요.", "error");

            alert("이미지를 읽을 수 없습니다. JPG 또는 PNG 파일을 사용해 주세요.");

            imageReady = false;

            updateButton();

        }

    }

    // 클릭해서 파일을 고른 경우
    uploadInput.addEventListener("change", function (event) {
        handleFile(event.target.files[0]);
    });

    // 끌어다 놓기: 파일이 박스 위에 있는 동안 강조 표시
    // (preventDefault가 없으면 브라우저가 이미지를 새 화면에서 열어버림)
    ["dragenter", "dragover"].forEach(function (type) {
        dropzone.addEventListener(type, function (e) {
            e.preventDefault();
            dropzone.classList.add("drag");
        });
    });

    ["dragleave", "drop"].forEach(function (type) {
        dropzone.addEventListener(type, function (e) {
            e.preventDefault();
            dropzone.classList.remove("drag");
        });
    });

    // 박스 위에 파일을 놓은 경우 (여러 장이면 첫 번째 파일만 사용)
    dropzone.addEventListener("drop", function (e) {
        handleFile(e.dataTransfer.files[0]);
    });


    // =====================================
    // 6. 이미지 전처리 (기기 간 결과 차이 최소화)
    // =====================================

    function createSquareCanvas(sizePx) {

        const canvas = document.createElement("canvas");

        canvas.width = sizePx;
        canvas.height = sizePx;

        const ctx = canvas.getContext("2d");

        if (!ctx) {
            throw new Error("Canvas를 생성할 수 없습니다.");
        }

        // 투명 PNG가 검은 배경으로 처리되지 않도록 흰색으로 먼저 채움
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, sizePx, sizePx);

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        return { canvas, ctx };

    }

    function preprocessImage(source) {

        // source: ImageBitmap 또는 HTMLImageElement
        const width = source.naturalWidth || source.width;
        const height = source.naturalHeight || source.height;

        // 중앙 크롭을 위한 정사각형 영역 계산
        const size = Math.min(width, height);

        const sx = (width - size) / 2;
        const sy = (height - size) / 2;

        // 1단계: 중앙 정사각형을 고정 해상도(512x512)로 변환
        const mid = createSquareCanvas(MID_SIZE);

        mid.ctx.drawImage(
            source,
            sx, sy, size, size,
            0, 0, MID_SIZE, MID_SIZE
        );

        // 2단계: 512 -> 224
        const out = createSquareCanvas(IMAGE_SIZE);

        out.ctx.drawImage(
            mid.canvas,
            0, 0, MID_SIZE, MID_SIZE,
            0, 0, IMAGE_SIZE, IMAGE_SIZE
        );

        console.log("전처리 이미지 크기:", out.canvas.width, out.canvas.height);

        return out.canvas;

    }


    // =====================================
    // 7. AI 이미지 분석
    // =====================================

    async function predictImage() {

        if (!model || !modelReady) {

            alert("AI 모델을 불러오는 중입니다.");

            return;

        }

        if (!imageReady) {

            alert("먼저 이미지를 업로드하세요.");

            return;

        }

        if (isAnalyzing) return;

        try {

            isAnalyzing = true;

            updateButton();

            resultEl.innerHTML = "";
            labelContainer.innerHTML = "";
            debugContainer.innerHTML = "";
            resultPanel.classList.remove("show");

            setStatus("AI가 이미지를 분석하고 있습니다...", "busy");

            // 이미지 디코딩 완료 확인
            await preview.decode();

            // 이미지 전처리 (비트맵이 있으면 비트맵 사용)
            const source = currentBitmap || preview;

            const canvas = preprocessImage(source);

            // 디버그: 모델에 들어가는 실제 이미지 표시
            if (DEBUG_PREPROCESS) {

                const label = document.createElement("div");

                label.textContent =
                    `모델 입력 이미지 (backend: ${tf.getBackend()}, ` +
                    `tfjs: ${tf.version.tfjs})`;

                debugContainer.appendChild(label);
                debugContainer.appendChild(canvas);

            }

            // Teachable Machine 예측
            const prediction = await model.predict(canvas);

            console.log("AI 전체 예측 결과:");
            console.table(prediction);

            // 가장 높은 확률의 클래스 찾기

            const sortedPrediction = [...prediction].sort(
                (a, b) => b.probability - a.probability
            );

            const bestPrediction = sortedPrediction[0];

            const animal = bestPrediction.className;
            const probability = bestPrediction.probability;

            // 최종 결과 출력: 이모지 + 문구 + 일치도 (textContent로 넣어 안전하게 표시)

            resultEl.innerHTML = "";

            const emoji = document.createElement("div");
            emoji.className = "emoji";
            emoji.textContent = emojiFor(animal);

            const headline = document.createElement("div");
            headline.className = "headline";
            headline.textContent = `당신은 "${animal}"상입니다!`;

            const percentText = document.createElement("div");
            percentText.className = "percent";
            percentText.textContent = `일치도 ${(probability * 100).toFixed(1)}%`;

            resultEl.appendChild(emoji);
            resultEl.appendChild(headline);
            resultEl.appendChild(percentText);

            // 클래스별 확률 출력

            const heading = document.createElement("h3");

            heading.textContent = "동물상별 인식 결과";

            labelContainer.appendChild(heading);

            sortedPrediction.forEach(function (item, index) {

                const percent = Math.max(
                    0,
                    Math.min(100, item.probability * 100)
                );

                const div = document.createElement("div");
                div.className = "result-item" + (index === 0 ? " top" : "");

                const title = document.createElement("div");
                title.className = "result-title";

                const name = document.createElement("span");
                name.textContent = emojiFor(item.className) + " " + item.className;

                const value = document.createElement("span");
                value.textContent = percent.toFixed(1) + "%";

                title.appendChild(name);
                title.appendChild(value);

                const progress = document.createElement("div");
                progress.className = "progress";

                const bar = document.createElement("div");
                bar.className = "progress-bar";
                bar.style.width = "0%";

                progress.appendChild(bar);

                div.appendChild(title);
                div.appendChild(progress);

                labelContainer.appendChild(div);

                // 막대가 0%에서 목표 값까지 차오르는 효과 (프레임 두 번 기다린 뒤 너비 지정)
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        bar.style.width = percent + "%";
                    });
                });

            });

            resultPanel.classList.add("show");

            resultPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });

            setStatus("분석이 완료되었습니다!");

            console.log("최종 동물상:", animal);
            console.log("최종 확률:", probability * 100);

        } catch (error) {

            console.error("이미지 분석 오류:", error);

            setStatus("이미지 분석에 실패했습니다.", "error");

            alert("이미지 분석 중 오류가 발생했습니다.");

        } finally {

            isAnalyzing = false;

            updateButton();

        }

    }


    // =====================================
    // 8. 분석 버튼 이벤트
    // =====================================

    analyzeButton.addEventListener("click", predictImage);


    // =====================================
    // 9. 페이지 실행
    // =====================================

    init();

</script>

</body>
</html>
