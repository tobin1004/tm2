<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI 동물상 테스트</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>

    <!-- Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px 15px;
            font-family: Arial, "Malgun Gothic", sans-serif;
            background: linear-gradient(135deg, #eef0ff, #f9f5ff, #edf5ff);
            color: #25243a;
            min-height: 100vh;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        /* 상단 제목 */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 30px;
            margin: 0 0 12px;
            color: #312e81;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #77758c;
            font-size: 15px;
            line-height: 1.7;
        }

        /* 메인 카드 */
        .main-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 12px 40px rgba(65, 55, 130, 0.10);
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #35325d;
        }

        /* 이미지 업로드 */
        .upload-area {
            border: 2px dashed #b9b4ee;
            background: #f8f7ff;
            border-radius: 18px;
            padding: 27px 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
        }

        .upload-area:hover {
            background: #f0efff;
            border-color: #7667dc;
        }

        .upload-icon {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .upload-main {
            color: #5145b8;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .upload-sub {
            color: #9995ae;
            font-size: 13px;
        }

        #image-upload {
            display: none;
        }

        /* 이미지 미리보기 */
        .preview-wrapper {
            text-align: center;
            margin-top: 20px;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 350px;
            border-radius: 16px;
            object-fit: contain;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        #image-info {
            color: #999;
            font-size: 12px;
            margin-top: 9px;
        }

        /* 분석 버튼 */
        .analyze-button {
            width: 100%;
            padding: 17px;
            margin-top: 25px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(110deg, #6558dc, #8a55d8);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(105, 85, 210, 0.25);
            transition: 0.2s;
        }

        .analyze-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 9px 20px rgba(105, 85, 210, 0.35);
        }

        .analyze-button:disabled {
            background: #c9c6d9;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 모델 상태 */
        .status-box {
            margin-top: 20px;
            padding: 13px;
            border-radius: 12px;
            background: #f5f5fa;
            text-align: center;
            color: #77748b;
            font-size: 13px;
        }

        /* 결과 영역 */
        #result-section {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        .result-card {
            background: linear-gradient(135deg, #f0edff, #f7f0ff);
            border: 1px solid #e4defc;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
        }

        .result-label {
            color: #8178b7;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .result-animal {
            font-size: 32px;
            font-weight: bold;
            color: #5143ba;
            margin-bottom: 12px;
        }

        .result-percent {
            display: inline-block;
            background: white;
            color: #775bd0;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
        }

        /* 확률 그래프 */
        .probability-section {
            margin-top: 28px;
        }

        .probability-title {
            font-size: 17px;
            font-weight: bold;
            color: #35325d;
            margin-bottom: 18px;
        }

        .result-item {
            margin-bottom: 20px;
        }

        .result-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            color: #55516e;
        }

        .result-title strong {
            color: #6558c9;
        }

        .progress {
            width: 100%;
            height: 13px;
            background: #eeedf5;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, #7565e5, #b16cdb);
            border-radius: 20px;
            transition: width 1s ease;
        }

        /* 하단 안내 */
        .notice {
            text-align: center;
            color: #9995aa;
            font-size: 12px;
            line-height: 1.7;
            margin-top: 23px;
        }

        /* 디버그 영역 */
        #debug-container {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }

        #debug-container canvas {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 8px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 모바일 화면 */
        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .main-card {
                padding: 22px 17px;
                border-radius: 20px;
            }

            h1 {
                font-size: 25px;
            }

            .header-icon {
                font-size: 42px;
            }

            .result-animal {
                font-size: 27px;
            }

            .upload-area {
                padding: 24px 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 상단 제목 -->
    <header class="header">
        <div class="header-icon">🐶 🦊 🐱</div>
        <h1>AI 동물상 테스트</h1>
        <div class="subtitle">
            인공지능이 사진을 분석하여<br>
            나와 닮은 동물상을 찾아드립니다!
        </div>
    </header>

    <main class="main-card">

        <!-- 이미지 업로드 -->
        <div class="section-title">
            📷 나의 사진 업로드
        </div>

        <label class="upload-area" for="image-upload">
            <div class="upload-icon">🖼️</div>
            <div class="upload-main">사진을 선택해 주세요</div>
            <div class="upload-sub">
                JPG, PNG 이미지 파일 지원
            </div>
        </label>

        <input type="file"
               id="image-upload"
               accept="image/*">

        <!-- 이미지 미리보기 -->
        <div class="preview-wrapper">
            <img id="preview" alt="업로드 이미지 미리보기">
            <div id="image-info"></div>
        </div>

        <!-- 분석 버튼 -->
        <button type="button"
                class="analyze-button"
                id="analyze-button"
                disabled>
            ✨ AI 동물상 분석하기
        </button>

        <!-- 모델 상태 -->
        <div class="status-box" id="status">
            ⏳ AI 모델을 불러오는 중입니다...
        </div>

        <!-- 분석 결과 -->
        <section id="result-section">

            <div class="result-card">
                <div class="result-label">
                    🎉 AI 분석 결과
                </div>

                <div class="result-animal" id="result-animal">
                </div>

                <div class="result-percent" id="result-percent">
                </div>
            </div>

            <!-- 클래스별 확률 -->
            <div class="probability-section">
                <div class="probability-title">
                    📊 동물상별 인식 확률
                </div>

                <div id="label-container"></div>
            </div>

        </section>

        <!-- 디버그 영역 -->
        <div id="debug-container"></div>

    </main>

    <footer class="notice">
        AI 분석 결과는 학습 데이터와 이미지에 따라 달라질 수 있습니다.<br>
        재미와 체험을 위한 인공지능 테스트입니다.
    </footer>

</div>


<script>

    // =====================================
    // 1. 모델 설정
    // =====================================

    const MODEL_URL = "./my_model/";

    const IMAGE_SIZE = 224;
    const MID_SIZE = 512;

    const DEBUG_PREPROCESS = false;

    let model = null;
    let modelReady = false;
    let imageReady = false;
    let isAnalyzing = false;

    let currentObjectURL = null;
    let currentBitmap = null;


    // =====================================
    // 2. HTML 요소 가져오기
    // =====================================

    const uploadInput = document.getElementById("image-upload");
    const preview = document.getElementById("preview");
    const analyzeButton = document.getElementById("analyze-button");
    const status = document.getElementById("status");
    const imageInfo = document.getElementById("image-info");

    const resultSection = document.getElementById("result-section");
    const resultAnimal = document.getElementById("result-animal");
    const resultPercent = document.getElementById("result-percent");

    const labelContainer = document.getElementById("label-container");
    const debugContainer = document.getElementById("debug-container");


    // =====================================
    // 3. 분석 버튼 상태 관리
    // =====================================

    function updateButton() {

        analyzeButton.disabled =
            !modelReady || !imageReady || isAnalyzing;

    }


    // =====================================
    // 4. AI 모델 로딩
    // =====================================

    async function init() {

        try {

            status.textContent = "⏳ TensorFlow.js 초기화 중...";

            // PC와 모바일의 연산 백엔드 통일
            await tf.setBackend("cpu");
            await tf.ready();

            console.log("Backend:", tf.getBackend());
            console.log("TensorFlow.js:", tf.version.tfjs);

            status.textContent = "⏳ AI 모델을 불러오는 중입니다...";

            const modelURL = MODEL_URL + "model.json";
            const metadataURL = MODEL_URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);

            modelReady = true;

            console.log("모델 로딩 완료");
            console.log("클래스:", model.getClassLabels());

            status.textContent =
                "✅ AI 모델 준비 완료! 사진을 업로드해 주세요.";

            updateButton();

        } catch (error) {

            console.error("모델 로딩 오류:", error);

            status.textContent =
                "❌ 모델 로딩에 실패했습니다. 모델 폴더를 확인하세요.";

            alert("AI 모델을 불러오지 못했습니다.");

        }

    }


    // =====================================
    // 5. 이미지 업로드
    // =====================================

    uploadInput.addEventListener("change", async function(event) {

        const file = event.target.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {

            alert("이미지 파일만 업로드할 수 있습니다.");

            uploadInput.value = "";

            return;

        }

        // 기존 분석 결과 초기화
        resultSection.style.display = "none";
        resultAnimal.textContent = "";
        resultPercent.textContent = "";
        labelContainer.innerHTML = "";
        debugContainer.innerHTML = "";
        imageInfo.textContent = "";

        imageReady = false;
        updateButton();

        try {

            // 이전 임시 URL 해제
            if (currentObjectURL) {
                URL.revokeObjectURL(currentObjectURL);
            }

            // 이전 비트맵 해제
            if (currentBitmap && currentBitmap.close) {
                currentBitmap.close();
            }

            currentBitmap = null;

            // 새로운 이미지 URL 생성
            currentObjectURL = URL.createObjectURL(file);

            preview.src = currentObjectURL;
            preview.style.display = "block";

            // 이미지 로딩 완료 대기
            await preview.decode();

            let width = preview.naturalWidth;
            let height = preview.naturalHeight;

            // EXIF 회전 적용
            if (window.createImageBitmap) {

                try {

                    currentBitmap = await createImageBitmap(file, {
                        imageOrientation: "from-image"
                    });

                    width = currentBitmap.width;
                    height = currentBitmap.height;

                } catch (error) {

                    console.warn("비트맵 생성 실패:", error);

                }

            }

            if (width === 0 || height === 0) {
                throw new Error("이미지 크기를 확인할 수 없습니다.");
            }

            imageReady = true;

            imageInfo.textContent =
                `원본 이미지 크기: ${width} × ${height}`;

            status.textContent =
                "✅ 이미지 업로드 완료! 분석할 수 있습니다.";

            console.log("이미지 크기:", width, height);

            updateButton();

        } catch (error) {

            console.error("이미지 업로드 오류:", error);

            status.textContent =
                "❌ 이미지를 불러오지 못했습니다.";

            alert("이미지를 읽을 수 없습니다. JPG 또는 PNG 파일을 사용해 주세요.");

            imageReady = false;
            updateButton();

        }

    });


    // =====================================
    // 6. 이미지 전처리
    // =====================================

    function createSquareCanvas(sizePx) {

        const canvas = document.createElement("canvas");

        canvas.width = sizePx;
        canvas.height = sizePx;

        const ctx = canvas.getContext("2d");

        if (!ctx) {
            throw new Error("Canvas를 생성할 수 없습니다.");
        }

        // 투명 배경은 흰색으로 처리
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, sizePx, sizePx);

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        return { canvas, ctx };

    }


    function preprocessImage(source) {

        const width = source.naturalWidth || source.width;
        const height = source.naturalHeight || source.height;

        // 중앙 정사각형 영역 계산
        const size = Math.min(width, height);

        const sx = (width - size) / 2;
        const sy = (height - size) / 2;

        // 1단계: 원본 이미지 → 512 × 512
        const mid = createSquareCanvas(MID_SIZE);

        mid.ctx.drawImage(
            source,
            sx, sy, size, size,
            0, 0, MID_SIZE, MID_SIZE
        );

        // 2단계: 512 × 512 → 224 × 224
        const out = createSquareCanvas(IMAGE_SIZE);

        out.ctx.drawImage(
            mid.canvas,
            0, 0, MID_SIZE, MID_SIZE,
            0, 0, IMAGE_SIZE, IMAGE_SIZE
        );

        console.log(
            "전처리 이미지:",
            out.canvas.width,
            out.canvas.height
        );

        return out.canvas;

    }


    // =====================================
    // 7. AI 이미지 분석
    // =====================================

    async function predictImage() {

        if (!model || !modelReady) {

            alert("AI 모델을 불러오는 중입니다.");

            return;

        }

        if (!imageReady) {

            alert("먼저 이미지를 업로드하세요.");

            return;

        }

        if (isAnalyzing) return;

        try {

            isAnalyzing = true;

            updateButton();

            resultSection.style.display = "none";
            labelContainer.innerHTML = "";
            debugContainer.innerHTML = "";

            status.textContent =
                "🔍 AI가 이미지를 분석하고 있습니다...";

            await preview.decode();

            // 비트맵이 있으면 비트맵 사용
            const source = currentBitmap || preview;

            // 이미지 전처리
            const canvas = preprocessImage(source);

            // 디버그 이미지 표시
            if (DEBUG_PREPROCESS) {

                const label = document.createElement("div");

                label.textContent =
                    `모델 입력 이미지 (${tf.getBackend()})`;

                debugContainer.appendChild(label);
                debugContainer.appendChild(canvas);

            }

            // Teachable Machine 예측
            const prediction = await model.predict(canvas);

            console.log("AI 예측 결과:");
            console.table(prediction);

            // 높은 확률순 정렬
            const sortedPrediction = [...prediction].sort(
                (a, b) => b.probability - a.probability
            );

            const bestPrediction = sortedPrediction[0];

            const animal = bestPrediction.className;
            const probability = bestPrediction.probability;

            // =================================
            // 최종 결과 출력
            // =================================

            resultAnimal.textContent =
                `🐾 ${animal}상`;

            resultPercent.textContent =
                `${(probability * 100).toFixed(1)}%`;

            // =================================
            // 클래스별 확률 출력
            // =================================

            sortedPrediction.forEach(function(item) {

                const percent = Math.max(
                    0,
                    Math.min(100, item.probability * 100)
                );

                const div = document.createElement("div");
                div.className = "result-item";

                const title = document.createElement("div");
                title.className = "result-title";

                const name = document.createElement("span");
                name.textContent = item.className;

                const value = document.createElement("strong");
                value.textContent = percent.toFixed(1) + "%";

                title.appendChild(name);
                title.appendChild(value);

                const progress = document.createElement("div");
                progress.className = "progress";

                const bar = document.createElement("div");
                bar.className = "progress-bar";

                bar.style.width = "0%";

                progress.appendChild(bar);

                div.appendChild(title);
                div.appendChild(progress);

                labelContainer.appendChild(div);

                // 막대그래프 애니메이션
                requestAnimationFrame(function() {
                    bar.style.width = percent + "%";
                });

            });

            // 결과 영역 표시
            resultSection.style.display = "block";

            status.textContent =
                "✅ 분석이 완료되었습니다!";

            console.log("최종 동물상:", animal);
            console.log("최종 확률:", probability * 100);

        } catch (error) {

            console.error("이미지 분석 오류:", error);

            status.textContent =
                "❌ 이미지 분석에 실패했습니다.";

            alert("이미지 분석 중 오류가 발생했습니다.");

        } finally {

            isAnalyzing = false;

            updateButton();

        }

    }


    // =====================================
    // 8. 분석 버튼 이벤트
    // =====================================

    analyzeButton.addEventListener("click", predictImage);


    // =====================================
    // 9. 페이지 실행
    // =====================================

    init();

</script>

</body>
</html>
